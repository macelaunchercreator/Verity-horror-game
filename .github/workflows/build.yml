name: Build Android APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Export debug APK
        run: |
          mkdir -p build
          docker run --rm -v "$PWD":/work -w /work barichello/godot-ci:4.3 bash -c '
            godot --headless --verbose --editor --quit
            godot --headless --verbose --export-debug "Android Debug" build/DEATH.apk
          '

      - uses: actions/upload-artifact@v4
        with:
          name: DEATH-apk
          path: build/DEATH.apk
